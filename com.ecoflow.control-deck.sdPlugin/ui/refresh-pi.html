<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refresh Settings</title>
  <link rel="stylesheet" href="sdpi.css">
</head>
<body>
  <div class="sdpi-wrapper">
    <h2 class="sdpi-heading">Manual Refresh</h2>

    <div class="sdpi-item">
      <label class="sdpi-item-label">Device</label>
      <div class="sdpi-item-value">
        <select id="deviceSerialNumber">
          <option value="">All devices</option>
        </select>
      </div>
    </div>

    <div class="sdpi-separator"></div>

    <div class="sdpi-message info">
      <p>Press this button to manually refresh device data. Leave "All devices" to refresh everything.</p>
    </div>
  </div>

  <script src="pi-common.js"></script>
</body>
</html>
